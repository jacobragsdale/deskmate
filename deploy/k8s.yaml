# Player Two's hub on Kubernetes. Before applying:
#   1. Build and push the image, then set `image` below.
#   2. kubectl create secret generic player-two --from-literal=join-token="$(openssl rand -hex 16)"
#   3. Set PLAYER_TWO_REPOS to the address your team's repos live under.
#   4. Set the Ingress host and TLS secret for your cluster.
# The volume must be an Azure Disk (on AKS, the managed-csi storage class), not Azure Files: SQLite needs real file locking, which a file share does not give.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: player-two
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: player-two
    spec:
      replicas: 1 # One SQLite file on one disk: never run a second pod.
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: player-two
      template:
        metadata:
          labels:
            app: player-two
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: hub
              image: REGISTRY/player-two:0.4.0
              ports:
                - containerPort: 8787
              env:
                - name: PLAYER_TWO_REPOS
                  value: https://dev.azure.com/YOUR-ORGANISATION/
                - name: PLAYER_TWO_JOIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: player-two
                      key: join-token
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: 8787
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: player-two
  - apiVersion: v1
    kind: Service
    metadata:
      name: player-two
    spec:
      selector:
        app: player-two
      ports:
        - port: 80
          targetPort: 8787
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: player-two
      # Without these every client's stream (GET /stream) keeps dropping. ingress-nginx ends a response it has read nothing of for 60 seconds, and holds back what the hub
      # writes until its buffer fills, so the hub's comment line every 20 seconds never reaches the client and an idle timeout between them cuts the stream instead.
      annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
    spec:
      ingressClassName: nginx
      tls:
        - hosts: [player-two.example.internal]
          secretName: player-two-tls
      rules:
        - host: player-two.example.internal
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: player-two
                    port:
                      number: 80
