# Deskmate hub on Kubernetes. Before applying:
#   1. Build and push the image, then set `image` below.
#   2. kubectl create secret generic deskmate --from-literal=join-token="$(openssl rand -hex 16)"
#   3. Set DESKMATE_REPOS to the address your team's repos live under.
#   4. Set the Ingress host and TLS secret for your cluster.
# The volume must be a disk (on AKS: managed-csi), not a file share: SQLite needs real file locking.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: deskmate
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: deskmate
    spec:
      replicas: 1 # One SQLite file on one disk: never run a second pod.
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: deskmate
      template:
        metadata:
          labels:
            app: deskmate
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: hub
              image: REGISTRY/deskmate:0.3.0
              ports:
                - containerPort: 8787
              env:
                - name: DESKMATE_REPOS
                  value: https://dev.azure.com/YOUR-ORGANISATION/
                - name: DESKMATE_JOIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: deskmate
                      key: join-token
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: 8787
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: deskmate
  - apiVersion: v1
    kind: Service
    metadata:
      name: deskmate
    spec:
      selector:
        app: deskmate
      ports:
        - port: 80
          targetPort: 8787
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: deskmate
    spec:
      ingressClassName: nginx
      tls:
        - hosts: [deskmate.example.internal]
          secretName: deskmate-tls
      rules:
        - host: deskmate.example.internal
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: deskmate
                    port:
                      number: 80
